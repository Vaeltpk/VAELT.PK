<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Detail - VAELT</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Product Detail Modal / Page -->
<div class="product-detail-container">
  <button class="close-btn" aria-label="Close">&times;</button>
  <div class="product-detail">
    <img src="images/product-1.jpg" alt="Product Image" class="product-image-large" />
    <h2 id="product-name">Product Name</h2>
    <p><strong>Brand:</strong> <span id="product-brand">Brand Name</span></p>
    <p><strong>Size:</strong> <span id="product-size">Size</span></p>
    <p><strong>Code:</strong> <span id="product-code">Code</span></p>
    <p><strong>Condition:</strong> <span id="product-condition">Condition</span></p>
    <p><strong>Price:</strong> Rs. <span id="product-price">0</span></p>
    <p><strong>Description:</strong> <span id="product-description">Description of the product.</span></p>
    <button class="btn btn-primary" id="ask-instagram-detail">ASK ON INSTAGRAM</button>
  </div>
</div>

<script>
  // Example: Populate product data dynamically
  const productData = {
    name: "Adidas Samba OG",
    brand: "Adidas",
    size: "42",
    code: "VA001",
    condition: "Excellent",
    price: 4200,
    description: "Clean pre-owned pair in excellent condition.",
    image: "images/product-1.jpg"
  };

  // Populate elements
  document.querySelector('#product-name').textContent = productData.name;
  document.querySelector('#product-brand').textContent = productData.brand;
  document.querySelector('#product-size').textContent = productData.size;
  document.querySelector('#product-code').textContent = productData.code;
  document.querySelector('#product-condition').textContent = productData.condition;
  document.querySelector('#product-price').textContent = productData.price.toLocaleString();
  document.querySelector('.product-image-large').src = productData.image;
  document.querySelector('.product-image-large').alt = productData.name;
  document.querySelector('#product-description').textContent = productData.description;

  // Ask on Instagram button
  document.getElementById('ask-instagram-detail').addEventListener('click', () => {
    const message = encodeURIComponent(`Hi VAELT, I'm interested in product ${productData.code} — ${productData.name}. Is it still available?`);
    window.open(`https://www.instagram.com/vaelt.pk/`, '_blank', 'noopener noreferrer');
  });

  // Close button
  document.querySelector('.close-btn').addEventListener('click', () => {
    window.history.back();
  });
</script>

</body>
</html>
